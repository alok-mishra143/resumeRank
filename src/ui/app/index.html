<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>resumerank</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1a1e'/%3E%3Cpath d='M9 22V10h6.2c2.6 0 4.1 1.3 4.1 3.5 0 1.7-.9 2.8-2.4 3.2l3 5.3h-2.6l-2.8-5h-3.1v5H9zm2.4-7.1h3.5c1.3 0 2.1-.6 2.1-1.6s-.8-1.6-2.1-1.6h-3.5v3.2z' fill='%23d2703a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
    <script>
      // Applied before first paint so the chosen theme never flashes.
      try {
        const q = new URLSearchParams(location.search).get("theme")
        const saved = q === "dark" || q === "light" ? q : localStorage.getItem("rr-theme")
        if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved
        else if (window.matchMedia?.("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"
      } catch {}
    </script>
  </head>
  <body>
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-dash" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4zm8 0c-.3 0-.7 0-1.1.1 1.3.9 2.1 2 2.1 3.9v2h7v-2c0-2.7-5.3-4-8-4z"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5a2 2 0 0 0-2 2v1a5 5 0 0 0 4.4 5 5 5 0 0 0 3.6 3.9V19H8v2h8v-2h-3v-2.1A5 5 0 0 0 16.6 13 5 5 0 0 0 21 8V7a2 2 0 0 0-2-2zM5 8V7h2v4a3 5 0 0 1-2-3zm14 0a3 5 0 0 1-2 3V7h2v1z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H5V3zm10 1.5V8h3.5L15 4.5zM7 12h10v2H7v-2zm0 4h7v2H7v-2z"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/></symbol>
      <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v10l3.5-3.5 1.4 1.4L12 16.8 7.1 11l1.4-1.4L12 13V3zM5 18h14v2H5v-2z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9zm3 2v8h2v-8H9zm4 0v8h2v-8h-2z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4 9 6z"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2v14a7 7 0 0 1 0-14z"/></symbol>
      <symbol id="i-scale" viewBox="0 0 24 24"><path d="M11 3h2v2h6v2h-2.2l2.7 6.2A4 4 0 0 1 12 15l-2.5-1.8L7.2 19H20v2H4v-2h.9l3-8H5V7h6V3zM7.3 7h2.4L8.5 9.7 7.3 7zm7 0h2.4l-1.2 2.7L14.3 7z"/></symbol>
    </svg>

    <div class="app">
      <aside class="rail">
        <div class="brand">
          <div class="brand-mark">r</div>
          <div class="brand-text"><strong>resumerank</strong><span id="brandSub">local · offline-first</span></div>
        </div>
        <nav class="nav" id="nav">
          <a class="nav-item" href="#/" data-view="dashboard"><svg><use href="#i-dash"/></svg><span>Dashboard</span></a>
          <a class="nav-item" href="#/candidates" data-view="candidates"><svg><use href="#i-users"/></svg><span>Candidates</span><em id="navCandidates"></em></a>
          <a class="nav-item" href="#/rank" data-view="rank"><svg><use href="#i-bolt"/></svg><span>Rank</span></a>
          <a class="nav-item" href="#/rankings" data-view="rankings"><svg><use href="#i-trophy"/></svg><span>Saved runs</span><em id="navRankings"></em></a>
          <a class="nav-item" href="#/skills" data-view="skills"><svg><use href="#i-grid"/></svg><span>Skill index</span></a>
        </nav>
        <div class="rail-foot">
          <div class="pill" id="jevPill"><span class="dot"></span><span id="jevText">checking…</span></div>
          <div class="rail-meta" id="railMeta">—</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="viewTitle">Dashboard</h1>
            <p id="viewSub">Local candidate intelligence</p>
          </div>
          <div class="topbar-actions">
            <label class="search">
              <svg><use href="#i-search"/></svg>
              <input id="globalSearch" placeholder="Search candidates, skills, roles…  (press /)" autocomplete="off" />
            </label>
            <button class="btn ghost" id="themeBtn" title="Switch theme"><svg><use href="#i-theme"/></svg><span id="themeLabel">Light</span></button>
            <button class="btn ghost" id="settingsBtn">Settings</button>
            <button class="btn primary" id="addBtn"><svg><use href="#i-plus"/></svg>Add resumes</button>
          </div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
    <div class="toasts" id="toasts"></div>
    <input type="file" id="filePicker" multiple accept=".pdf,.docx,.txt,.md" hidden />
    <script src="/app.js"></script>
  </body>
</html>
